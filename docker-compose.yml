version: '3.8'

services:
  bulela:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bulela-app
    ports:
      - "3000:3000"
    volumes:
      # Persist SQLite database
      - ./bulela.db:/app/bulela.db
      # Persist feedback data
      - ./feedback.json:/app/feedback.json
    environment:
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
      - OLLAMA_MODEL=gemma4:latest
      - DEMO_MODE=false
      - NODE_ENV=production
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bulela-network

  ollama:
    image: ollama/ollama:latest
    container_name: bulela-ollama
    ports:
      - "11434:11434"
    volumes:
      # Persist Ollama models
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    # GPU support (uncomment if you have NVIDIA GPU and nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - bulela-network

networks:
  bulela-network:
    driver: bridge

volumes:
  ollama_data:
    driver: local
